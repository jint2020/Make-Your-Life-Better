# 生产部署。用法见 README「部署」一节：
#   cp .env.example .env   # 填好域名和密码
#   docker compose pull && docker compose up -d
#
# 只有 web（Caddy）对外开放 80/443；server、postgres、minio 都在内部网络里。
# converter 在单独的 converter 网络里，只和 server 相通，不能访问外网，也不挂任何凭据。

services:
  web:
    image: ghcr.io/jint2020/make-your-life-better-web:${APP_VERSION:-latest}
    build: ./web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?在 .env 里填 SITE_ADDRESS（域名）}
      # /api/convert 的请求体上限，要比 CONVERT_MAX_FILE_BYTES 多留出 multipart 开销
      CONVERT_BODY_LIMIT: ${CONVERT_BODY_LIMIT:-21MiB}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    image: ghcr.io/jint2020/make-your-life-better-server:${APP_VERSION:-latest}
    build:
      context: ./server
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mylb}:${POSTGRES_PASSWORD:?在 .env 里填 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mylb}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-mylb}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?在 .env 里填 MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-mylb}
      # 发送验证码的 SMTP
      SMTP_HOST: ${SMTP_HOST:?在 .env 里填 SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_FROM: ${SMTP_FROM:?在 .env 里填 SMTP_FROM}
      # 云端额度（字节 / 个），不填用默认值：500 MB、50 个任务、单文件 50 MB
      USER_QUOTA_BYTES: ${USER_QUOTA_BYTES:-524288000}
      USER_MAX_TASKS: ${USER_MAX_TASKS:-50}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-52428800}
      # 文件转 Markdown：converter 只在内部网络里，用服务名访问
      CONVERTER_URL: http://converter:8001
      # 不填用默认值：单文件 20 MB、每小时 60 次、每天 300 次、转换超时 100 秒、全局同时 10 个
      CONVERT_MAX_FILE_BYTES: ${CONVERT_MAX_FILE_BYTES:-20971520}
      CONVERT_HOURLY_LIMIT: ${CONVERT_HOURLY_LIMIT:-60}
      CONVERT_DAILY_LIMIT: ${CONVERT_DAILY_LIMIT:-300}
      CONVERT_REQUEST_TIMEOUT_SECONDS: ${CONVERT_REQUEST_TIMEOUT_SECONDS:-100}
      CONVERT_MAX_IN_FLIGHT: ${CONVERT_MAX_IN_FLIGHT:-10}
    networks:
      - default
      - converter
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # 不等 converter 健康：这个工具挂了不该拖慢 server 启动，见 docs/design.md 第三节

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mylb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里填 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mylb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 官方 minio/minio 镜像已不再发布到 Docker Hub，这里用社区维护的分支（pgsty/minio）。
    # 想换镜像时设置 MINIO_IMAGE
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mylb}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?在 .env 里填 MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  converter:
    # 文件转 Markdown（见 docs/design.md 第三节）：不挂任何凭据、不接外网，阅后即焚
    image: ghcr.io/jint2020/make-your-life-better-converter:${APP_VERSION:-latest}
    build: ./converter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - converter
    healthcheck:
      # 启动时要先转一个样例预热（约 13 秒），预热完才算健康，所以 start_period 给得宽松
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  # server 留在隐式的 default 网络里（跟 web/postgres/minio 一样），另外再加入 converter 网络
  converter:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
