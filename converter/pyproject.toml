[project]
name = "mylb-converter"
version = "0.0.0"
description = "Make Your Life Better 文件转 Markdown 服务：只做转换，阅后即焚"
requires-python = ">=3.13"
dependencies = [
    "markitdown[pdf,docx,pptx]==0.1.8",
    "openpyxl>=3.1",
    "charset-normalizer>=3.3",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "psutil>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "python-docx>=1.1",
    "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
