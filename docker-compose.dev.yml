# 本机日常开发：只起依赖服务，前后端在本机跑。
#   docker compose -f docker-compose.dev.yml up -d
#   cd server && uv run fastapi dev app/main.py
#   cd web && pnpm dev
name: mylb-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mylb
      POSTGRES_PASSWORD: mylb
      POSTGRES_DB: mylb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mylb -d mylb"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mylb
      MINIO_ROOT_PASSWORD: mylb-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001" # 控制台：http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # 收件箱网页：http://localhost:8025

volumes:
  postgres_data:
  minio_data:
